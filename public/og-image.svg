<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#09090b"/>

  <!-- Radial Glow Behind Logo -->
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Subtle Border Grid Frame -->
  <rect x="32" y="32" width="1136" height="566" rx="32" fill="none" stroke="#27272a" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#facc15" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Brand Centerpiece Group -->
  <g transform="translate(600, 180)">
    <!-- Logo Mark Container -->
    <rect x="-64" y="-70" width="128" height="128" rx="36" fill="#facc15"/>
    <!-- Logo SVG Icon -->
    <g transform="translate(-40, -46) scale(3.33)" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="6" stroke-width="2.5"/>
      <path d="M16 6v12" stroke-width="2.8"/>
      <path d="M9 12l2 2 4-4" stroke-width="2.5"/>
    </g>

    <!-- App Name Title -->
    <text x="0" y="115" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-0.04em">
      atendee<tspan fill="#facc15">.</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="170" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#e4e4e7" letter-spacing="-0.01em">
      Modern Attendance &amp; Fellowship Gathering Hub
    </text>

    <!-- Sub-Description -->
    <text x="0" y="210" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#a1a1aa">
      Offline-First Check-In • Real-Time Cloud Sync • Dynamic Member Rosters
    </text>
  </g>

  <!-- Feature Badges at Bottom -->
  <g transform="translate(600, 485)">
    <!-- Badge 1 -->
    <g transform="translate(-390, 0)">
      <rect x="-115" y="-22" width="230" height="44" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#facc15">⚡ Pass-the-Phone Kiosk</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-130, 0)">
      <rect x="-115" y="-22" width="230" height="44" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#facc15">📊 1-Click Excel Import</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(130, 0)">
      <rect x="-115" y="-22" width="230" height="44" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#facc15">☁️ Real-Time Cloud Sync</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(390, 0)">
      <rect x="-115" y="-22" width="230" height="44" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#facc15">🛡️ Multi-Tenant Isolated</text>
    </g>
  </g>
</svg>
