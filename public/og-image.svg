<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Subtle frame -->
  <rect x="32" y="32" width="1136" height="566" rx="32" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#facc15" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Logo mark: yellow badge -->
  <rect x="536" y="90" width="128" height="128" rx="36" fill="#facc15"/>

  <!-- 'a' mark inside badge: scaled from 24x24 viewBox to fit ~84x84 inside the 128x128 badge -->
  <!-- 84/24 = 3.5 scale, offset so mark is centered: badge at (536,90), mark center at (536+64, 90+64) = (600,154) -->
  <!-- mark origin translated to (600-12*3.5, 154-12*3.5) = (600-42, 154-42) = (558, 112) -->
  <g transform="translate(558, 112) scale(3.5)" fill="none">
    <line x1="15.5" y1="4" x2="15.5" y2="20"
          stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 15.5 7.2 A 7.6 7.6 0 1 0 15.5 16.8"
          stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- App wordmark -->
  <text x="600" y="290"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="900"
        font-size="72"
        fill="#ffffff"
        letter-spacing="-3">atendee<tspan fill="#facc15">.</tspan></text>

  <!-- Tagline -->
  <text x="600" y="352"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="600"
        font-size="26"
        fill="#a1a1aa"
        letter-spacing="-0.3">Modern Attendance &amp; Fellowship Gathering Hub</text>

  <!-- Feature pills -->
  <g transform="translate(600, 490)">
    <!-- Badge 1 -->
    <g transform="translate(-390, 0)">
      <rect x="-110" y="-20" width="220" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle"
            font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#facc15">⚡ Pass-the-Phone Kiosk</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-130, 0)">
      <rect x="-110" y="-20" width="220" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle"
            font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#facc15">📊 1-Click Excel Import</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(130, 0)">
      <rect x="-110" y="-20" width="220" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle"
            font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#facc15">☁️ Real-Time Cloud Sync</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(390, 0)">
      <rect x="-110" y="-20" width="220" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle"
            font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#facc15">🛡️ Multi-Tenant Isolated</text>
    </g>
  </g>
</svg>
